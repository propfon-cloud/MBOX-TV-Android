name: Build MBOX TV APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build direct debug APK
        run: gradle :app:assembleDirectDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk release/MBOX_TV.apk
          sha256sum release/MBOX_TV.apk | tee release/MBOX_TV.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBOX_TV_APK
          path: release/*
          if-no-files-found: error
          retention-days: 30
